name: Publish Existing Windows Installer
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified successful Windows build (no rebuild)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/actions/artifacts/13036990006/zip > artifact.zip
          unzip -o artifact.zip -d extracted
          test -s extracted/installer-output/SnipAndExtract-Setup-Windows.exe
      - name: Publish installer only to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.0.2 extracted/installer-output/SnipAndExtract-Setup-Windows.exe --repo "${{ github.repository }}" --clobber
