name: Windows Release
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Windows platform files
        run: flutter create --platforms=windows --project-name snipandextract .
      - name: Generate branded Windows icon
        shell: pwsh
        run: ./generate_icon.ps1
      - name: Get packages
        run: flutter pub get
      - name: Remove generated template test
        shell: pwsh
        run: Remove-Item test/widget_test.dart -ErrorAction SilentlyContinue
      - name: Analyse Dart
        run: flutter analyze
      - name: Build Windows
        run: flutter build windows --release
      - name: Add native bridge
        shell: pwsh
        run: Copy-Item snip_native.ps1 build/windows/x64/runner/Release/snip_native.ps1
      - name: Package portable ZIP
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath SnipAndExtract-Portable-Windows.zip
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\\Inno Setup 6\\ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler not found at $compiler" }
          & $compiler installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }
      - name: Upload portable and installer
        uses: actions/upload-artifact@v4
        with:
          name: SnipAndExtract-Windows
          path: |
            SnipAndExtract-Portable-Windows.zip
            installer-output/SnipAndExtract-Setup-Windows.exe
          if-no-files-found: error
      - name: Publish release assets for tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" SnipAndExtract-Portable-Windows.zip installer-output/SnipAndExtract-Setup-Windows.exe --title "Snip & Extract ${{ github.ref_name }}" --generate-notes
